name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: windows-11-arm
            platform: windows-arm64
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: macos-arm64

    name: build (${{ matrix.platform }})

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '11.0.x'

    - name: Version Information
      run: dotnet --info

    - name: Build
      run: pwsh make.ps1 build

  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        framework: ['net10.0', 'net11.0']

    name: test (${{ matrix.runner }}, ${{ matrix.framework }})

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '11.0.x'

    - name: Build
      run: pwsh make.ps1 -frameworks ${{ matrix.framework }} build
    - name: ReadyToRun
      run: ./make.ps1 -frameworks ${{ matrix.framework }} readytorun
      shell: pwsh
    - name: Native dependency smoke
      run: >-
        dotnet run --project tests/NativeDependencySmoke
        -f ${{ matrix.framework }}
      shell: pwsh
    - name: Version Information
      run: |
        dotnet --info
        dotnet "bin/Release/${{ matrix.framework }}/ipy.dll" -VV
      shell: pwsh
    - name: Test
      run: ./make.ps1 -frameworks ${{ matrix.framework }} test-all
      shell: pwsh
